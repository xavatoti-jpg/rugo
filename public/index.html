<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rugo · Live chat for anything</title>
<meta name="description" content="Live chat for anything. Join the conversation during games, movies, award shows and more — live, with people around the world.">
<link rel="icon" href="/brand/rugo-mark.svg" type="image/svg+xml">
<link rel="icon" href="/brand/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0e0e12">
<meta name="apple-mobile-web-app-title" content="Rugo">
<meta property="og:type" content="website">
<meta property="og:title" content="Rugo · Live chat for anything">
<meta property="og:description" content="Live chat for anything. Join the conversation during games, movies, award shows and more — live, with people around the world.">
<meta property="og:url" content="https://rugo.chat/">
<meta property="og:image" content="https://rugo.chat/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://rugo.chat/brand/og-image.png">
<style>
  :root { --bg:#0e0e12; --panel:#18181f; --panel2:#202029; --line:#2a2a35; --text:#ececf1; --muted:#9a9aa8; --accent:#9b5cff; --live:#ff4757; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; }

  /* Barra de arriba */
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:6px; position:sticky; top:0; background:var(--bg); z-index:5; }
  .logo { font-weight:900; font-size:21px; margin-right:6px; white-space:nowrap; display:inline-flex; align-items:center; gap:7px; letter-spacing:-.02em; }
  .logo img { width:30px; height:30px; transition:transform .25s; }
  .logo:hover img { transform:rotate(-8deg) scale(1.08); }
  .logo b { color:var(--accent); font-weight:inherit; }
  .tab { padding:7px 11px; border-radius:999px; color:var(--muted); font-weight:600; font-size:14px; white-space:nowrap; }
  .tab:hover { color:var(--text); background:var(--panel); }
  .tab.on { color:var(--text); background:var(--panel2); }
  .spacer { flex:1; }
  .ghost-btn { background:none; color:var(--text); border:1px solid var(--line); border-radius:999px; padding:7px 12px; font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap; }
  .ghost-btn:hover { border-color:var(--muted); }
  .login-btn { background:var(--accent); color:#fff; border:0; border-radius:999px; padding:7px 14px; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap; }
  .avatar { width:34px; height:34px; border-radius:50%; border:0; cursor:pointer; background:var(--panel2) center/cover; font-weight:800; display:grid; place-items:center; flex-shrink:0; }
  .menu { position:absolute; right:16px; top:54px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px; min-width:180px; box-shadow:0 10px 30px #0008; }
  .menu div { padding:10px 12px; color:var(--muted); font-size:14px; }
  .menu button { width:100%; text-align:left; background:none; border:0; padding:10px 12px; border-radius:8px; cursor:pointer; }
  .menu button:hover { background:var(--panel2); }

  main { max-width:760px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:26px; margin:0 0 4px; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:28px 0 12px; display:flex; align-items:center; gap:8px; }
  .sub { color:var(--muted); margin:0 0 20px; }

  /* Categorías */
  .genres { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .genre { position:relative; border-radius:18px; padding:18px 16px; min-height:130px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden;
           background:linear-gradient(140deg, var(--c) -40%, var(--panel) 75%); border:1px solid var(--line); transition:transform .15s; }
  .genre:hover { transform:translateY(-2px); border-color:var(--c); }
  .genre .emoji { font-size:38px; }
  .genre .name { font-weight:800; font-size:18px; }
  .genre .info { font-size:13px; color:var(--muted); margin-top:4px; }
  .genre:first-child { grid-column:span 2; min-height:150px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--live); animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }

  /* En vivo */
  .live-list { display:grid; gap:10px; }
  .live-card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:14px; }
  .live-card:hover { border-color:var(--accent); }
  .live-card .rank { font-weight:800; color:var(--muted); width:18px; text-align:center; flex-shrink:0; }
  .live-card .body { flex:1; min-width:0; }
  .live-card .top { font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .live-card .title { font-weight:700; margin:4px 0 2px; }
  .live-card .score { font-size:14px; opacity:.85; }
  .live-card .go { background:var(--accent); color:#fff; border-radius:10px; padding:8px 12px; font-weight:700; font-size:14px; white-space:nowrap; }
  .live-card.hot { border-color:#ff6b3566; background:linear-gradient(120deg,#ff6b3518,var(--panel) 60%); }
  .badge-live { color:var(--live); font-weight:800; display:inline-flex; align-items:center; gap:5px; }
  .general { border-style:dashed; }
  .empty { color:var(--muted); text-align:center; padding:28px 12px; background:var(--panel); border-radius:14px; }
  .empty a { color:var(--accent); font-weight:700; }

  .cal-btn { margin-top:28px; width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; cursor:pointer; text-align:left; }
  .cal-btn:hover { border-color:var(--accent); }
  .cal-btn small { display:block; color:var(--muted); margin-top:2px; }

  /* Películas en cartelera */
  .regions { display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px; margin:4px 0 18px; }
  .regions button { border:0; background:none; padding:7px 14px; border-radius:999px; cursor:pointer; color:var(--muted); font-weight:600; font-size:14px; }
  .regions button.on { background:var(--accent); color:#fff; }
  .posters { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; }
  .poster { display:block; }
  .poster .img { aspect-ratio:2/3; border-radius:12px; background:var(--panel2) center/cover; border:1px solid var(--line); position:relative; overflow:hidden; display:grid; place-items:center; font-size:40px; transition:transform .15s; }
  .poster:hover .img { transform:translateY(-3px); border-color:var(--accent); }
  .poster .img .cnt { position:absolute; left:8px; bottom:8px; background:#000b; color:#fff; font-size:12px; font-weight:700; padding:3px 8px; border-radius:999px; }
  .poster .img .rt { position:absolute; right:8px; top:8px; background:#000b; color:#fdcb6e; font-size:12px; font-weight:700; padding:3px 7px; border-radius:999px; }
  .poster .t { font-weight:700; font-size:14px; margin-top:8px; line-height:1.3; }
  .poster .d { font-size:12px; color:var(--muted); }
  .attr { font-size:12px; color:var(--muted); margin-top:30px; text-align:center; }

  /* Portada: banners en vivo */
  main.wide { max-width:1100px; }
  .home-head { display:flex; align-items:baseline; justify-content:space-between; margin:4px 0 14px; }
  .home-head h2 { margin:0; }
  .home-head small { color:var(--muted); font-size:13px; }
  .banners { display:grid; gap:14px; grid-template-columns:1fr; }
  @media (min-width:720px) { .banners { grid-template-columns:1fr 1fr; } .banner.hero { grid-column:1 / -1; } }
  .banner { position:relative; display:block; height:190px; border-radius:20px; overflow:hidden; isolation:isolate; border:1px solid #ffffff14;
            box-shadow:0 10px 30px #0006; transition:transform .2s, box-shadow .2s; background:#15151c; }
  .banner:hover { transform:translateY(-3px); box-shadow:0 16px 40px #000a; }
  .banner.hero { height:250px; }
  @media (min-width:720px) { .banner.hero { height:300px; } }
  .bn-half { position:absolute; inset:0; display:flex; align-items:center; z-index:-2; }
  .bn-half.l { clip-path:polygon(0 0, 54% 0, 46% 100%, 0 100%); background:var(--a); background:linear-gradient(135deg, var(--a) 0%, color-mix(in srgb, var(--a) 45%, #000) 100%); justify-content:flex-start; }
  .bn-half.r { clip-path:polygon(54% 0, 100% 0, 100% 100%, 46% 100%); background:var(--b); background:linear-gradient(225deg, var(--b) 0%, color-mix(in srgb, var(--b) 45%, #000) 100%); justify-content:flex-end; }
  .bn-half .wm { position:absolute; top:50%; width:62%; aspect-ratio:1; transform:translateY(-50%); opacity:.16; background-size:contain; background-repeat:no-repeat; background-position:center; filter:saturate(0) brightness(2); }
  .bn-half.l .wm { left:-14%; } .bn-half.r .wm { right:-14%; }
  .bn-seam { position:absolute; inset:0; z-index:-1; background:linear-gradient(98deg, transparent 49.2%, #ffffffaa 49.6%, #ffffff 50%, #ffffffaa 50.4%, transparent 50.8%); opacity:.35; mix-blend-mode:overlay; }
  .bn-shade { position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg, #0000 35%, #000c 100%), radial-gradient(ellipse at 50% 45%, #0000 40%, #0005 100%); }
  .bn-top { position:absolute; top:12px; left:14px; right:14px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .bn-tags { display:flex; gap:6px; min-width:0; overflow:hidden; }
  .bn-tags .bn-tag:last-child:not(:first-child) { flex-shrink:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:719px) { .carousel .bn-tag.trend .tx { display:none; } }
  .bn-tag { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.04em; background:#000a; backdrop-filter:blur(6px); white-space:nowrap; color:#fff; }
  .bn-tag.live { background:var(--live); }
  .bn-tag.live .dot { background:#fff; }
  .bn-tag.final { color:#fdcb6e; }
  .bn-tag.trend { background:linear-gradient(90deg,#ff6b35,#ff4757); }
  .bn-teams { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 14px; }
  .team { display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; }
  .crest { position:relative; width:64px; height:64px; display:grid; place-items:center; }
  .hero .crest { width:96px; height:96px; }
  .hero .bn-teams { top:46%; }
  .crest.ok .abbr { display:none; }
  .crest img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 6px 12px #0009); }
  .crest .abbr { width:100%; height:100%; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:18px; background:#ffffff1f; border:2px solid #ffffff55; color:#fff; }
  .hero .crest .abbr { font-size:24px; }
  .tname { font-weight:800; font-size:13px; text-shadow:0 2px 8px #000; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#fff; }
  .hero .tname { font-size:16px; }
  .scorebox { display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 14px; border-radius:14px; background:#000b; backdrop-filter:blur(8px); border:1px solid #ffffff22; min-width:92px; }
  .scorebox b { font-size:24px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:.02em; color:#fff; }
  .hero .scorebox b { font-size:34px; }
  .scorebox b .w { color:#fdcb6e; font-size:inherit; font-style:normal; }
  .scorebox span { font-size:11px; color:#ffffffb0; font-weight:700; white-space:nowrap; }
  .scorebox .vs { font-size:18px; color:#fff; }
  .bn-bottom { position:absolute; left:14px; right:14px; bottom:12px; display:flex; align-items:end; justify-content:space-between; gap:10px; }
  .bn-title { font-weight:800; font-size:15px; text-shadow:0 2px 10px #000; line-height:1.25; min-width:0; color:#fff; }
  .hero .bn-title { font-size:19px; }
  .bn-title small { display:block; font-size:12px; font-weight:600; color:#ffffffb8; }
  .bn-join { flex-shrink:0; padding:9px 14px; border-radius:999px; background:#fff; color:#111; font-weight:800; font-size:13px; transition:transform .15s; }
  .banner:hover .bn-join { transform:scale(1.05); }
  /* Banner sin equipos: póster de película o color de la categoría */
  .bn-solo { position:absolute; inset:0; z-index:-2; background:var(--a); background:linear-gradient(135deg, var(--a), color-mix(in srgb, var(--a) 35%, #000)); }
  .bn-solo.poster { background-size:cover; background-position:center 25%; filter:blur(18px) brightness(.55) saturate(1.3); transform:scale(1.2); }
  .bn-emoji { position:absolute; right:18px; top:50%; transform:translateY(-58%); font-size:72px; filter:drop-shadow(0 8px 16px #0008); }
  .bn-poster { position:absolute; right:16px; top:50%; transform:translateY(-58%) rotate(3deg); height:62%; aspect-ratio:2/3; border-radius:10px; background-size:cover; background-position:center; box-shadow:0 10px 24px #000b; border:2px solid #ffffff30; }

  /* Moderación */
  .mod-btn { opacity:0; background:none; border:0; color:var(--muted); font-size:18px; line-height:1; padding:2px 6px; border-radius:8px; cursor:pointer; align-self:flex-start; }
  .msg:hover .mod-btn, .mod-btn:focus { opacity:1; }
  @media (hover:none) { .mod-btn { opacity:.6; } }
  .mod-btn:hover { background:#ffffff14; color:var(--text); }
  .staff { font-size:10px; font-weight:800; padding:1px 6px; border-radius:999px; background:#2ecc7122; color:#2ecc71; border:1px solid #2ecc7155; }
  .sheet { position:fixed; inset:0; background:#000a; z-index:30; display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:600px) { .sheet { align-items:center; } }
  .sheet-box { width:100%; max-width:400px; background:var(--panel); border:1px solid var(--line); border-radius:20px 20px 0 0; padding:18px 14px calc(14px + env(safe-area-inset-bottom)); animation:sheetUp .2s ease-out; }
  @media (min-width:600px) { .sheet-box { border-radius:20px; } }
  @keyframes sheetUp { from { transform:translateY(30px); opacity:0; } }
  .sheet-box h3 { margin:0 0 2px; font-size:18px; }
  .sheet-box .q { color:var(--muted); font-size:13px; margin:0 0 12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sheet-box button { width:100%; display:flex; align-items:center; gap:10px; text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; font-weight:600; }
  .sheet-box button:hover { border-color:var(--muted); }
  .sheet-box .row3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .sheet-box .row3 button { justify-content:center; margin:0 0 8px; }
  .sheet-box .danger { color:#ff7675; border-color:#ff767555; }
  .sheet-box .danger.big { background:#ff47571a; }
  .sheet-box .cancel { justify-content:center; background:none; }
  .sheet-box .lbl { font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin:6px 2px 8px; }
  .muted-bar { margin:10px 12px calc(10px + env(safe-area-inset-bottom)); padding:14px 16px; border-radius:16px; border:1px solid #ffb34755; background:#ffb3471a; color:#ffb347; text-align:center; font-weight:600; }
  .blocked { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px; padding:30px; }
  .blocked .big { font-size:52px; }
  .blocked b { font-size:20px; }
  .blocked span { color:var(--muted); }
  .mod-list { display:grid; gap:10px; }
  .mod-item { display:flex; gap:12px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .mod-item .body { flex:1; min-width:0; }
  .mod-item .body small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .mod-item .k { font-size:22px; }
  .lift { background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:7px 12px; cursor:pointer; font-weight:700; font-size:13px; }
  .lift:hover { border-color:#2ecc71; color:#2ecc71; }

  /* Titular de la portada */
  .hero-line { margin:2px 0 18px; }
  .hero-line h1 { font-size:28px; line-height:1.15; margin:0; letter-spacing:-.02em; font-weight:900; }
  @media (min-width:720px) { .hero-line h1 { font-size:38px; } }
  .hero-line .rot { display:inline-block; background:linear-gradient(90deg, #ffd166, #ff7a35 45%, #e84393 75%, #9b5cff); -webkit-background-clip:text; background-clip:text; color:transparent; transition:opacity .25s, transform .25s; }
  .hero-line .rot.out { opacity:0; transform:translateY(8px); }
  .hero-line .dotp { color:var(--accent); }
  .hero-line p { margin:6px 0 0; color:var(--muted); font-size:15px; }

  /* Portada compacta */
  .home .h-sec { margin-bottom:26px; }
  .h-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 10px; }
  .h-head h2 { margin:0; }
  .h-right { display:flex; align-items:center; gap:6px; }
  .h-right small { color:var(--muted); font-size:13px; margin-right:4px; }
  .see { color:var(--muted); font-size:14px; font-weight:600; }
  .see:hover { color:var(--text); }
  .arrow { display:none; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--panel); cursor:pointer; font-size:18px; line-height:1; }
  .arrow:hover { border-color:var(--muted); }
  @media (min-width:720px) and (hover:hover) { .arrow { display:grid; place-items:center; } }
  .carousel { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; scroll-behavior:smooth; margin:0 -16px; padding:0 16px; scroll-padding:0 16px; }
  .carousel::-webkit-scrollbar { display:none; }
  .carousel .banner { flex:0 0 88%; height:172px; scroll-snap-align:start; box-shadow:0 6px 18px #0005; }
  .carousel .banner:hover { transform:none; }
  @media (min-width:720px) { .carousel { margin:0; padding:0; scroll-padding:0; } .carousel .banner { flex-basis:calc(50% - 6px); height:196px; } }
  .carousel .crest { width:54px; height:54px; }
  .carousel .scorebox { padding:6px 12px; min-width:84px; }
  .carousel .scorebox b { font-size:21px; }
  .carousel .tname { font-size:12px; }
  .carousel .bn-teams { top:48%; }
  .dots { display:flex; justify-content:center; gap:6px; margin-top:10px; min-height:8px; }
  .dots button { width:7px; height:7px; border-radius:999px; border:0; background:#ffffff30; padding:0; cursor:pointer; transition:.2s; }
  .dots button.on { width:22px; background:var(--accent); }
  .row-scroll { display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:2px 16px 4px; }
  .row-scroll::-webkit-scrollbar { display:none; }
  @media (min-width:720px) { .row-scroll { margin:0; padding:2px 0 4px; } }
  .mini { flex:0 0 150px; border-radius:14px; padding:10px 12px; border:1px solid var(--line); background:linear-gradient(135deg, color-mix(in srgb, var(--a) 30%, var(--panel)) , var(--panel) 60%, color-mix(in srgb, var(--b) 25%, var(--panel))); background-color:var(--panel); }
  .mini:hover { border-color:var(--muted); }
  .mini-top { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); font-weight:700; }
  .mini-top b { color:var(--text); }
  .mini-teams { display:flex; align-items:center; justify-content:center; gap:8px; margin:10px 0 6px; }
  .ml { position:relative; width:38px; height:38px; display:grid; place-items:center; }
  .ml img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; z-index:1; }
  .ml i { font-style:normal; font-weight:900; font-size:11px; width:100%; height:100%; display:grid; place-items:center; border-radius:50%; background:#ffffff14; }
  .ml.big { font-size:30px; }
  .vs { font-size:11px; color:var(--muted); font-weight:800; }
  .mini-name { font-size:12px; font-weight:700; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cat-chip { flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:10px 14px 10px 10px; border-radius:14px; border:1px solid var(--line); background:linear-gradient(135deg, color-mix(in srgb, var(--c) 28%, var(--panel)), var(--panel) 70%); background-color:var(--panel); }
  .cat-chip:hover { border-color:var(--c); }
  .cat-chip .e { font-size:26px; }
  .cat-chip b { display:block; font-size:14px; white-space:nowrap; }
  .cat-chip small { font-size:12px; color:var(--muted); white-space:nowrap; }
  .mini-poster { flex:0 0 108px; }
  .mini-poster .img { aspect-ratio:2/3; border-radius:12px; background:var(--panel2) center/cover; border:1px solid var(--line); display:grid; place-items:center; font-size:30px; position:relative; }
  .mini-poster .cnt { position:absolute; left:6px; bottom:6px; background:#000b; font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; }

<body>
<header id="hdr"></header>
<div id="app"></div>

<script src="/vendor/supabase.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const app = document.getElementById("app");
const hdr = document.getElementById("hdr");
let socket = null, genres = [], timer = null;
let cfg = { auth:false }, sb = null, session = null, me = null;
let favs = new Set(); // salas guardadas en My Chats
// Preferencias de esta persona en este aparato (Settings → Chat)
const PREF_DEFAULTS = { reactions: true, timestamps: true, compact: false, textSize: "m" };
let prefs = { ...PREF_DEFAULTS };
try { prefs = { ...PREF_DEFAULTS, ...JSON.parse(localStorage.getItem("prefs") || "{}") }; } catch {}
function savePrefs() { try { localStorage.setItem("prefs", JSON.stringify(prefs)); } catch {} applyPrefs(); }
function applyPrefs() {
  document.body.classList.toggle("compact", prefs.compact);
  document.body.classList.toggle("no-time", !prefs.timestamps);
  document.body.dataset.text = prefs.textSize;
}
const NAME_COLORS = ["#ff6b6b", "#ff9f43", "#feca57", "#1dd1a1", "#48dbfb", "#54a0ff", "#9b5cff", "#ff6bcb", "#c8d6e5"];
const isStaff = () => me?.role === "mod" || me?.role === "admin";

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const colorFor = (name) => `hsl(${[...name].reduce((a,c)=>a+c.charCodeAt(0),0)*47%360} 80% 70%)`;
const hora = (iso) => new Date(iso).toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit", hour12:true });
const dayKey = (d) => { d = new Date(d); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
const api = async (u, opts) => (await fetch(u, opts)).json();
const authHeader = () => session ? { Authorization: "Bearer " + session.access_token } : {};

// ================= Cuentas (Google / Facebook) =================
async function initAuth() {
  try { cfg = await api("/api/config"); } catch {}
  if (!cfg.auth || !window.supabase) return;
  sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { flowType:"pkce", detectSessionInUrl:true, persistSession:true } });
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_ev, s) => { session = s; });
  // Volver a donde estaba la persona antes de iniciar sesión
  if (location.search.includes("code=")) {
    const back = sessionStorage.getItem("returnTo") || "#/";
    sessionStorage.removeItem("returnTo");
    history.replaceState(null, "", location.pathname + back);
  }
  await loadMe();
}

async function loadMe() {
  me = null;
  if (!session) return;
  const r = await fetch("/api/me", { headers: authHeader() });
  if (r.ok) me = await r.json();
  if (me?.username) await loadFavs();
}

async function loadFavs() {
  try {
    const r = await fetch("/api/favorites", { headers: authHeader() });
    favs = new Set(r.ok ? (await r.json()).map((f) => f.id) : []);
  } catch { favs = new Set(); }
}

async function toggleFav(id) {
  if (!me?.username) return openLogin("signup");
  const saved = favs.has(id);
  const r = await fetch("/api/favorites/" + encodeURIComponent(id), { method: saved ? "DELETE" : "POST", headers: authHeader() });
  if (!r.ok) { const d = await r.json().catch(() => ({})); alert(d.error || "Something went wrong"); return favs.has(id); }
  saved ? favs.delete(id) : favs.add(id);
  const n = document.querySelector(".mychats-btn .n");
  if (n) { n.textContent = favs.size; n.style.display = favs.size ? "" : "none"; }
  return favs.has(id);
}

function openLogin(mode) {
  const signup = mode === "signup";
  const div = document.createElement("div");
  div.className = "overlay";
  div.innerHTML = `<div class="modal">
    <button class="close" aria-label="Close">×</button>
    <h3>${signup ? "Join Rugo 🦁" : "Welcome back 🦁"}</h3>
    <p>${signup ? "Create your account to chat live with fans around the world." : "Sign in to keep chatting."}</p>
    <button class="oauth" data-p="google"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>
    <button class="oauth fb" data-p="facebook"><svg viewBox="0 0 24 24" fill="#fff"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.5h-2.8V24C19.62 23.1 24 18.1 24 12.07"/></svg>Continue with Facebook</button>
    <div class="legal">By continuing you agree to our <a href="/privacy.html" target="_blank">Privacy Policy</a>.</div>
    <div class="legal" style="margin-top:14px">${signup ? `Already have an account? <a href="#" data-switch="signin">Sign in</a>` : `New to Rugo? <a href="#" data-switch="signup">Sign up</a>`}</div>
  </div>`;
  document.body.appendChild(div);
  div.onclick = async (e) => {
    if (e.target === div || e.target.closest(".close")) return div.remove();
    const sw = e.target.closest("[data-switch]")?.dataset.switch;
    if (sw) { e.preventDefault(); div.remove(); return openLogin(sw); }
    const p = e.target.closest("[data-p]")?.dataset.p;
    if (!p) return;
    sessionStorage.setItem("returnTo", location.hash || "#/");
    const { error } = await sb.auth.signInWithOAuth({ provider: p, options: { redirectTo: location.origin + "/" } });
    if (error) alert("Could not sign in: " + error.message);
  };
}

async function logout() {
  await sb.auth.signOut();
  session = null; me = null; favs = new Set();
  route();
}

// Primera vez: elegir nombre de usuario
function chooseUsername() {
  header("");
  app.innerHTML = `<div class="namebox"><h1>Welcome! 🦁</h1>
    <p class="sub">Pick your username. This is how people will see you in chats, and no one else can use it.</p>
    <input class="field" id="un" maxlength="20" placeholder="e.g. BuzzerBeater23" autocomplete="off">
    <div class="err" id="err"></div>
    <button class="btn" id="save" style="width:100%">Save</button>
    <p class="legal" style="margin-top:14px">3–20 letters, numbers or _ · Can't be changed later</p></div>`;
  const input = document.getElementById("un");
  const save = async () => {
    const r = await fetch("/api/profile", { method:"POST", headers:{ "Content-Type":"application/json", ...authHeader() }, body: JSON.stringify({ username: input.value.trim() }) });
    const data = await r.json();
    if (!r.ok) return (document.getElementById("err").textContent = data.error);
    me.username = data.username;
    route();
  };
  document.getElementById("save").onclick = save;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") save(); });
  input.focus();
}

// ================= Barra de arriba =================
function header(active) {
  requestAnimationFrame(() => document.documentElement.style.setProperty("--hdr", hdr.offsetHeight + "px"));
  const tab = (href, label, key) => `<a class="tab ${active === key ? "on" : ""}" href="${href}">${label}</a>`;
  let right = "";
  if (cfg.auth) {
    right = me?.username
      ? `<a class="mychats-btn ${active === "my" ? "on" : ""}" href="#/mychats">★ My Chats <span class="n" style="${favs.size ? "" : "display:none"}">${favs.size}</span></a><button class="avatar" id="av" style="${me.avatar ? `background-image:url('${esc(me.avatar)}')` : `color:${colorFor(me.username)}`}">${me.avatar ? "" : esc(me.username[0].toUpperCase())}</button>`
      : `<button class="ghost-btn" id="signinBtn">Sign in</button><button class="login-btn" id="signupBtn">Sign up</button>`;
  }
  const gear = `<a class="gear ${active === "set" ? "on" : ""}" href="#/settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>`;
  hdr.innerHTML = `<a class="logo" href="#/" aria-label="Rugo home"><img src="/brand/rugo-mark.svg" alt="" width="30" height="30"><span class="wm">Rug<b>o</b></span></a>
    <nav class="nav">${tab("#/categories", "Categories", "cat")}${tab("#/calendar", "Calendar", "cal")}</nav>
    <div class="spacer"></div><div class="auth">${right}${gear}</div>`;
  document.getElementById("signinBtn")?.addEventListener("click", () => openLogin("signin"));
  document.getElementById("signupBtn")?.addEventListener("click", () => openLogin("signup"));
  document.getElementById("av")?.addEventListener("click", (e) => {
    e.stopPropagation();
    const old = document.querySelector(".menu");
    if (old) return old.remove();
    const m = document.createElement("div");
    m.className = "menu";
    m.innerHTML = `<div>@${esc(me.username)}${isStaff() ? ` · <span class="staff">${me.role.toUpperCase()}</span>` : ""}</div><button id="setLink">⚙️ Settings</button>${isStaff() ? `<button id="modLink">🛡️ Moderation</button>` : ""}<button id="out">Sign out</button>`;
    document.body.appendChild(m);
    m.querySelector("#out").onclick = () => { m.remove(); logout(); };
    m.querySelector("#modLink")?.addEventListener("click", () => { m.remove(); location.hash = "#/mod"; });
    m.querySelector("#setLink").addEventListener("click", () => { m.remove(); location.hash = "#/settings"; });
    setTimeout(() => document.addEventListener("click", () => m.remove(), { once:true }));
  });
}

// ================= Navegación =================
function route() {
  if (socket) { socket.disconnect(); socket = null; }
  clearInterval(timer);
  document.querySelector(".menu")?.remove();
  window.scrollTo(0, 0);
  if (cfg.auth && session && me && !me.username) return chooseUsername();
  const h = location.hash;
  let m;
  if ((m = h.match(/^#\/room\/(.+)$/))) return showRoom(decodeURIComponent(m[1]));
  if (h === "#/categories") return showCategories();
  if (h === "#/mychats") return showMyChats();
  if (h === "#/mod") return showModPanel();
  if (h === "#/settings") return showSettings();
  if (h === "#/calendar") return showCalendar(null);
  if ((m = h.match(/^#\/g\/([^/]+)\/calendar$/))) return showCalendar(m[1]);
  if ((m = h.match(/^#\/g\/([^/]+)$/))) return showGenre(m[1]);
  showHome();
}
window.addEventListener("hashchange", route);

async function loadGenres() { genres = await api("/api/genres"); return genres; }
const genreById = (id) => genres.find((g) => g.id === id);

// ---------- Inicio: lo que está EN VIVO, lo más popular primero ----------
async function showHome() {
  header("home");
  app.innerHTML = `<main class="wide home">
    <div class="hero-line"><h1>Live chat for <span class="rot" id="rot">anything</span><span class="dotp">.</span></h1>
      <p>Jump into the conversation with people around the world — right now.</p></div>
    <section class="h-sec">
      <div class="h-head"><h2><span class="dot"></span> Live now</h2><div class="h-right"><small id="liveCount"></small>
        <button class="arrow" id="prev" aria-label="Previous">‹</button><button class="arrow" id="next" aria-label="Next">›</button></div></div>
      <div class="carousel" id="car"></div>
      <div class="dots" id="dots"></div>
    </section>
    <section class="h-sec" id="soonSec" hidden><div class="h-head"><h2>⏰ Starting soon</h2><a class="see" href="#/calendar">Calendar ›</a></div><div class="row-scroll" id="soon"></div></section>
    <section class="h-sec"><div class="h-head"><h2>Browse</h2><a class="see" href="#/categories">All ›</a></div><div class="row-scroll" id="browse"></div></section>
    <section class="h-sec" id="movSec" hidden><div class="h-head"><h2>🍿 In theaters</h2><a class="see" href="#/g/theaters">See all ›</a></div><div class="row-scroll" id="movies"></div></section>
    <section class="h-sec" id="bigSec" hidden><div class="h-head"><h2>🏆 Big events</h2><a class="see" href="#/calendar">Calendar ›</a></div><div class="big-list" id="big"></div></section>
  </main>`;

  const car = document.getElementById("car"), dots = document.getElementById("dots");
  let sig = "", paused = false;
  const slides = () => [...car.querySelectorAll(".banner")];
  const current = () => Math.round(car.scrollLeft / ((slides()[0]?.offsetWidth || 1) + 12));
  const go = (i) => { const sl = slides(); if (!sl.length) return; const n = (i + sl.length) % sl.length; car.scrollTo({ left: sl[n].offsetLeft - car.offsetLeft, behavior: "smooth" }); };
  const drawDots = () => { const n = slides().length, c = current(); dots.innerHTML = n > 1 ? slides().map((_, i) => `<button class="${i === c ? "on" : ""}" data-i="${i}" aria-label="Slide ${i + 1}"></button>`).join("") : ""; };
  car.addEventListener("scroll", () => { clearTimeout(car._t); car._t = setTimeout(drawDots, 80); });
  dots.onclick = (e) => { const i = e.target.dataset.i; if (i != null) go(+i); };
  document.getElementById("prev").onclick = () => go(current() - 1);
  document.getElementById("next").onclick = () => go(current() + 1);
  ["pointerenter", "touchstart", "focusin"].forEach((ev) => car.addEventListener(ev, () => (paused = true), { passive: true }));
  car.addEventListener("pointerleave", () => (paused = false));

  const drawLive = async () => {
    const [list] = await Promise.all([api("/api/live"), genres.length ? null : loadGenres()]);
    if (!document.getElementById("car")) return;
    const n = list.reduce((t, e) => t + e.online, 0);
    document.getElementById("liveCount").textContent = list.length ? `${list.length} live${n ? ` · ${n} chatting` : ""}` : "";
    // Solo redibujar si algo cambió (así no salta el carrusel)
    const newSig = JSON.stringify(list.map((e) => [e.id, e.score, e.detail, e.online]));
    if (newSig === sig) return;
    sig = newSig;
    const keep = car.scrollLeft;
    car.innerHTML = list.length ? list.map((e, i) => banner(e, false, i === 0)).join("")
      : `<div class="empty" style="flex:1">Nothing is live right now. Check what's starting soon below 👇</div>`;
    car.scrollLeft = keep;
    document.querySelectorAll(".arrow").forEach((a) => (a.style.display = list.length > 1 ? "" : "none"));
    drawDots();
  };

  const drawRest = async () => {
    const region = (() => { try { return localStorage.getItem("region") || "US"; } catch { return "US"; } })();
    const [events, mv] = await Promise.all([api("/api/events"), api("/api/movies?region=" + region).catch(() => null)]);
    if (!document.getElementById("soon")) return;
    const now = Date.now();
    // Empieza pronto: partidos y eventos de las próximas 24 horas
    const soon = events.filter((e) => e.state === "upcoming" && !e.allDay && new Date(e.start) - now < 24 * 3600e3).slice(0, 12);
    document.getElementById("soonSec").hidden = !soon.length;
    document.getElementById("soon").innerHTML = soon.map(miniCard).join("");
    // Categorías
    document.getElementById("browse").innerHTML = genres.map((g) => `<a class="cat-chip" href="#/g/${g.id}" style="--c:${g.color}"><span class="e">${g.emoji}</span><span><b>${esc(g.name)}</b><small>${g.id === "theaters" ? (g.showing ? `${g.showing} movies` : "Movies") : g.live ? `<span class="badge-live"><span class="dot"></span>${g.live} live</span>` : "Browse"}</small></span></a>`).join("");
    // Películas
    const movies = mv?.movies?.slice(0, 12) || [];
    document.getElementById("movSec").hidden = !movies.length;
    document.getElementById("movies").innerHTML = movies.map((m) => `<a class="mini-poster" href="#/room/${encodeURIComponent(m.id)}"><div class="img" style="${m.poster ? `background-image:url('${esc(m.poster)}')` : ""}">${m.poster ? "" : "🎬"}${m.online ? `<span class="cnt">👥 ${m.online}</span>` : ""}</div><div class="t">${esc(m.title)}</div></a>`).join("");
    // Grandes eventos (Oscars, Grammys, Super Bowl…)
    const big = events.filter((e) => e.special && !e.allDay && e.state === "upcoming").slice(0, 5);
    document.getElementById("bigSec").hidden = !big.length;
    document.getElementById("big").innerHTML = big.map((e) => {
      const d = new Date(e.start), g = genreById(e.genre);
      return `<a class="big-row" href="#/room/${encodeURIComponent(e.id)}"><div class="date"><small>${d.toLocaleDateString("en-US", { month:"short" })}</small><b>${d.getDate()}</b></div>
        <div class="body"><b>${esc(e.title)}</b><small>${g ? g.emoji + " " : ""}${esc(e.league)} · ${d.toLocaleDateString("en-US", { weekday:"short" })} ${hora(e.start)}</small></div>
        <span class="see">${favs.has(e.id) ? "★" : "›"}</span></a>`;
    }).join("");
  };

  // Palabra que va cambiando en el titular
  const words = ["games", "movies", "award shows", "concerts", "reality TV", "anything"];
  let wi = words.length - 1;
  const rot = document.getElementById("rot");
  const rotTimer = setInterval(() => {
    if (!document.getElementById("rot")) return clearInterval(rotTimer);
    wi = (wi + 1) % words.length;
    rot.classList.add("out");
    setTimeout(() => { rot.textContent = words[wi]; rot.classList.remove("out"); }, 260);
  }, 2200);

  await drawLive();
  drawRest();
  let tick = 0;
  timer = setInterval(() => {
    tick++;
    // El carrusel avanza cada 7 s; lo en vivo se actualiza cada ~30 s y el resto cada ~2 min
    if (!paused && document.visibilityState === "visible" && slides().length > 1) go(current() + 1);
    if (tick % 4 === 0) drawLive();
    if (tick % 17 === 0) drawRest();
  }, 7000);
}

// Tarjeta pequeña para "Starting soon"
function miniCard(e) {
  const t = e.teams;
  const logo = (x) => `<span class="ml">${x.logo ? `<img src="${esc(x.logo)}" alt="" loading="lazy" onerror="this.remove()">` : ""}<i>${esc(x.abbr || "")}</i></span>`;
  return `<a class="mini" href="#/room/${encodeURIComponent(e.id)}" style="--a:${esc(t?.[0]?.color || genreById(e.genre)?.color || "#9b5cff")};--b:${esc(t?.[1]?.color || "#333")}">
    <div class="mini-top"><span>${esc(e.league)}</span><b>${hora(e.start)}</b></div>
    ${t && t.length === 2 ? `<div class="mini-teams">${logo(t[0])}<span class="vs">vs</span>${logo(t[1])}</div><div class="mini-name">${esc(t[0].name)} vs ${esc(t[1].name)}</div>`
      : `<div class="mini-teams"><span class="ml big">${genreById(e.genre)?.emoji || "📅"}</span></div><div class="mini-name">${esc(e.title)}</div>`}
  </a>`;
}

// Banner de la portada. Partidos: cada mitad con el color y logo de un equipo.
function banner(e, hero, trending) {
  const g = genreById(e.genre);
  const tag = e.state === "upcoming" ? `<span class="bn-tag">⏰ ${esc(new Date(e.start).toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" }))}</span>`
    : e.always ? `<span class="bn-tag">💬 ALWAYS OPEN</span>`
    : e.ongoing ? `<span class="bn-tag">🍿 IN THEATERS</span>`
    : e.state === "post" ? `<span class="bn-tag final">🏁 FINAL</span>`
    : `<span class="bn-tag live"><span class="dot"></span>LIVE</span>`;
  const top = `<div class="bn-top"><div class="bn-tags">${tag}${(hero || trending) && e.online ? `<span class="bn-tag trend">🔥<span class="tx"> TRENDING</span></span>` : ""}${e.ongoing ? (e.rating ? `<span class="bn-tag">★ ${e.rating}</span>` : "") : e.always ? "" : `<span class="bn-tag">${esc(e.league)}${e.detail && e.state !== "upcoming" ? ` · ${esc(e.detail)}` : ""}</span>`}</div>
    <span class="bn-tag">👥 ${e.online}</span></div>`;
  const join = `<span class="bn-join">${e.state === "upcoming" ? "Pregame chat" : e.online ? "Join chat" : "Start the chat"} →</span>`;
  const t = e.teams;

  if (t && t.length === 2) {
    const crest = (x) => `<div class="crest"><span class="abbr">${esc(x.abbr || "?")}</span>${x.logo ? `<img src="${esc(x.logo)}" alt="${esc(x.name)}" loading="lazy" onload="this.parentNode.classList.add('ok')" onerror="this.remove()">` : ""}</div>`;
    const sc = (x, other) => x.score == null ? "" : (x.winner || (e.state === "post" && +x.score > +other.score)) ? `<i class="w">${esc(x.score)}</i>` : esc(x.score);
    const mid = t[0].score != null
      ? `<div class="scorebox"><b>${sc(t[0], t[1])} - ${sc(t[1], t[0])}</b><span>${esc(e.state === "post" ? "Final" : e.detail || "Live")}</span></div>`
      : `<div class="scorebox"><b class="vs">VS</b><span>${esc(e.state === "upcoming" ? new Date(e.start).toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" }) : e.detail || "")}</span></div>`;
    return `<a class="banner ${hero ? "hero" : ""}" href="#/room/${encodeURIComponent(e.id)}" style="--a:${esc(t[0].color)};--b:${esc(t[1].color)}">
      <div class="bn-half l">${t[0].logo ? `<div class="wm" style="background-image:url('${esc(t[0].logo)}')"></div>` : ""}</div>
      <div class="bn-half r">${t[1].logo ? `<div class="wm" style="background-image:url('${esc(t[1].logo)}')"></div>` : ""}</div>
      <div class="bn-seam"></div><div class="bn-shade"></div>
      ${top}
      <div class="bn-teams"><div class="team">${crest(t[0])}<div class="tname">${esc(t[0].name)}</div></div>${mid}<div class="team">${crest(t[1])}<div class="tname">${esc(t[1].name)}</div></div></div>
      <div class="bn-bottom"><div class="bn-title"><small>${esc(e.category || "")}</small></div>${join}</div>
    </a>`;
  }
  // Sin equipos (películas, premios, charla general…)
  return `<a class="banner ${hero ? "hero" : ""}" href="#/room/${encodeURIComponent(e.id)}" style="--a:${g?.color || "#9b5cff"}">
    ${e.poster ? `<div class="bn-solo poster" style="background-image:url('${esc(e.poster)}')"></div><div class="bn-poster" style="background-image:url('${esc(e.poster)}')"></div>`
      : `<div class="bn-solo"></div><div class="bn-emoji">${g?.emoji || "💬"}</div>`}
    <div class="bn-shade"></div>${top}
    <div class="bn-bottom"><div class="bn-title"><small>${esc(e.ongoing ? "Now playing" : e.always ? g?.name || "" : e.category || "")}</small>${esc(e.title)}</div>${join}</div>
  </a>`;
}

function liveCard(e, rank) {
  const g = genreById(e.genre);
  return `<a class="live-card ${e.always ? "general" : ""} ${rank && rank <= 3 && e.online > 0 ? "hot" : ""}" href="#/room/${encodeURIComponent(e.id)}">
    ${rank ? `<div class="rank">${rank}</div>` : ""}
    <div class="body">
      <div class="top">${e.always ? "💬 Always open" : e.ongoing ? "🍿 In theaters" : e.state === "post" ? `<span class="final">🏁 FINAL</span>` : `<span class="badge-live"><span class="dot"></span>LIVE</span>`}${g && rank && !e.ongoing ? `<span>${g.emoji}</span>` : ""}<span>${esc(e.always || e.ongoing ? "" : e.league)}</span>${e.detail ? `<span>· ${esc(e.detail)}</span>` : ""}</div>
      <div class="title">${esc(e.title)}</div>
      ${e.score ? `<div class="score">${esc(e.score)}</div>` : ""}
    </div>
    <div class="go">${e.online ? `👥 ${e.online}` : "Join"}</div>
  </a>`;
}

// ---------- My Chats: favoritos ----------
async function showMyChats() {
  header("my");
  if (!cfg.auth) return (location.hash = "#/");
  if (!me?.username) {
    app.innerHTML = `<main><h1>★ My Chats</h1><div class="empty">Save your favorite chats and find them here.<br><br><button class="btn" id="su">Sign up to save chats</button></div></main>`;
    document.getElementById("su").onclick = () => openLogin("signup");
    return;
  }
  app.innerHTML = `<main><h1>★ My Chats</h1><p class="sub">Your saved chats.</p><div id="fav"><div class="empty">Loading…</div></div></main>`;
  if (!genres.length) await loadGenres();
  const r = await fetch("/api/favorites", { headers: authHeader() });
  const list = r.ok ? await r.json() : [];
  favs = new Set(list.map((f) => f.id));
  const live = list.filter((e) => e.state === "live" || e.state === "post").sort((a, b) => b.online - a.online);
  const soon = list.filter((e) => e.state === "upcoming").sort((a, b) => new Date(a.start) - new Date(b.start));
  const past = list.filter((e) => e.state === "done");
  const row = (e, isPast) => `<div class="fav-row ${isPast ? "past" : ""}">

  document.getElementById("fav").innerHTML = list.length

  document.getElementById("fav").onclick = async (e) => {

}

// Recorta la imagen al centro en cuadrado y la hace pequeña (en el mismo aparato, antes de subirla)
function squareImage(file, size) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) return reject(new Error("Please choose an image."));
    if (file.size > 15 * 1024 * 1024) return reject(new Error("That image is too big (max 15 MB)."));
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("This image format isn't supported. Try a JPG or PNG.")); };
    img.src = url;
  });
}

function openModSheet(m) {
  const div = document.createElement("div");
  div.className = "sheet";
  const acct = Boolean(m.uid);
  div.innerHTML = `<div class="sheet-box">
    <h3>🛡️ ${esc(m.name)}</h3><p class="q">“${esc(m.text)}”</p>
    <button data-a="delete">🗑️ Delete this message</button>
    ${acct ? `<div class="lbl">Mute in this chat</div>
    <div class="row3"><button data-a="mute" data-m="5">5 min</button><button data-a="mute" data-m="60">1 hour</button><button data-a="mute" data-m="1440">24 hours</button></div>
    <div class="row3" style="grid-template-columns:1fr 1fr"><button data-a="removephoto">🖼️ Remove photo</button><button data-a="removephoto" data-block="1">🖼️ Remove & block uploads</button></div>
    <button data-a="kick">👢 Remove from this chat</button>
    <button class="danger" data-a="ban">🚫 Remove & ban from this chat</button>
    <button class="danger big" data-a="globalban">⛔ Remove & ban from ALL chats</button>` : `<p class="q">This person has no account, so only their message can be deleted.</p>`}
    <button class="cancel" data-a="cancel">Cancel</button></div>`;
  document.body.appendChild(div);
  div.onclick = (e) => {
    if (e.target === div) return div.remove();
    const btn = e.target.closest("[data-a]");
    if (!btn) return;
    const action = btn.dataset.a;
    if (action === "cancel") return div.remove();
    let reason = null;
    if (action === "ban" || action === "globalban") {
      const where = action === "ban" ? "this chat" : "ALL chats";
      if (!confirm(`Ban ${m.name} from ${where}?`)) return;
      reason = prompt("Reason (optional):", "") || null;
    }
    socket?.emit("mod", { action, uid: m.uid || null, name: m.name, messageId: m.id, minutes: +btn.dataset.m || undefined, reason, blockUploads: btn.dataset.block === "1" }, (r) => {
      if (r?.error) alert(r.error);
    });
    div.remove();
  };
}

let calDay = null, calChip = "All";
async function showCalendar(gid) {
  header("cal");
  if (!genres.length) await loadGenres();
  const g = gid ? genreById(gid) : null;
  if (gid && !g) return (location.hash = "#/calendar");
  const events = (await api("/api/events" + (gid ? "?genre=" + gid : ""))).filter((e) => e.state === "upcoming");
  // En el calendario general se filtra por categoría; dentro de una categoría, por deporte/tipo
  const chipOf = (e) => gid ? e.category : (genreById(e.genre)?.name || "");

  const days = [];
  for (let i = 0; i < 8; i++) { const d = new Date(); d.setDate(d.getDate() + i); days.push(d); }
  const weekEnd = new Date(days[7]); weekEnd.setHours(0, 0, 0, 0);
  const tabs = [...days.slice(0, 7).map((d, i) => ({ key: dayKey(d),
      top: i === 0 ? "Today" : i === 1 ? "Tmrw" : d.toLocaleDateString("en-US", { weekday:"short" }), num: d.getDate() })),
    { key: "later", top: "Later", num: "⋯" }];
  const localDay = (e) => e.allDay ? new Date(e.start.slice(0, 10) + "T12:00:00") : new Date(e.start);
  const inTab = (e, key) => key === "later" ? localDay(e) >= weekEnd : dayKey(localDay(e)) === key;
  if (!calDay || !tabs.some((t) => t.key === calDay)) calDay = (tabs.find((t) => events.some((e) => inTab(e, t.key))) || tabs[0]).key;
  calChip = "All";

  const render = () => {
    const ofDay = events.filter((e) => inTab(e, calDay));
    const chips = ["All", ...new Set(ofDay.map(chipOf))];
    if (!chips.includes(calChip)) calChip = "All";
    const list = ofDay.filter((e) => calChip === "All" || chipOf(e) === calChip);
    app.innerHTML = `<main><h1>📅 ${g ? esc(g.name) : "Calendar"}</h1><p class="sub">Tap an event to join its chat room.</p>
      <div class="days">${tabs.map((t) => `<div class="day ${t.key === calDay ? "on" : ""} ${events.some((e) => inTab(e, t.key)) ? "" : "none"}" data-k="${t.key}"><small>${t.top}</small><b>${t.num}</b></div>`).join("")}</div>
      ${chips.length > 2 ? `<div class="chips">${chips.map((c) => `<button class="chip ${c === calChip ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : ""}
      <div>${list.length ? list.map((e) => `
        <a class="row" href="#/room/${encodeURIComponent(e.id)}">
          <div class="time">${calDay === "later" ? new Date(e.start).toLocaleDateString("en-US", { day:"numeric", month:"short", timeZone:"UTC" }) : e.allDay ? "🍿 Opens" : hora(e.start)}</div>
          <div><div class="title">${gid ? "" : (genreById(e.genre)?.emoji || "") + " "}${esc(e.title)}</div><div class="lg">${esc(e.league)} · ${esc(e.category)}</div></div>
        </a>`).join("") : `<div class="empty" style="margin-top:14px">No events on this day.</div>`}</div></main>`;
    app.querySelector(".days").onclick = (ev) => { const k = ev.target.closest(".day")?.dataset.k; if (k) { calDay = k; render(); } };
    app.querySelector(".chips")?.addEventListener("click", (ev) => { if (ev.target.dataset.c) { calChip = ev.target.dataset.c; render(); } });
  };
  render();
}

// ---------- Sala de chat ----------
const REACTIONS = ["🔥", "😱", "👏", "😂", "💯", "❤️", "🎉", "😡", "🐐"];
const PICKER = ["😀","😂","🤣","😍","😎","🤯","😱","😭","😡","🥶","🤔","🙌","👏","🔥","💯","❤️","💔","🎉","🐐","👑","🏆","🏀","⚽","🏈","⚾","🥊","🎬","🍿","🎮","🎵","👀","💪"];
const timeOf = (t) => new Date(t).toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" });

async function showRoom(id) {
  header("");
  const res = await fetch("/api/events/" + encodeURIComponent(id));
  if (!res.ok) { app.innerHTML = `<div class="namebox">This room no longer exists. <a href="#/" style="color:var(--accent)">Go back</a></div>`; return; }
  const ev = await res.json();
  // Sin cuentas activadas: modo invitado con apodo
  const guestName = !cfg.auth ? localStorage.getItem("apodo") : null;
  if (!cfg.auth && !guestName) return askName(() => showRoom(id));
  if (!genres.length) await loadGenres();
  const g = genreById(ev.genre);

  const isLive = ev.state === "live" && !ev.always && !ev.ongoing;
  const when = ev.state === "upcoming" ? (ev.allDay
    ? `Opens ${new Date(ev.start).toLocaleDateString("en-US", { month:"short", day:"numeric", timeZone:"UTC" })}`
    : `Starts ${new Date(ev.start).toLocaleString("en-US", { weekday:"short", hour:"numeric", minute:"2-digit" })}`) : "";
  const badge = isLive ? `<span class="pill live"><span class="dot"></span>LIVE</span>`
    : ev.state === "post" ? `<span class="pill final">🏁 FINAL · Postgame</span>`
    : ev.ongoing ? `<span class="pill">🍿 Now playing</span>` : ev.always ? `<span class="pill">💬 Always open</span>`
    : when ? `<span class="pill">📅 ${esc(when)}</span>` : "";

  app.innerHTML = `<div class="room" style="--c:${g?.color || "#9b5cff"}">
    <div class="room-head">
      <div class="rh-top">
        <a class="icon-btn" href="javascript:history.back()" aria-label="Back">←</a>
        <div class="rh-badges">${badge}<span class="pill muted">${g ? g.emoji + " " : ""}${esc(ev.league)}</span></div>
        <div class="rh-actions">
          <span class="pill viewers" id="online"><span class="dot green"></span>${ev.online}</span>
          ${cfg.auth ? `<button class="save-btn ${favs.has(ev.id) ? "on" : ""}" id="saveBtn">${favs.has(ev.id) ? "★ Saved" : "☆ Save"}</button>` : ""}
        </div>
      </div>
      <h1>${esc(ev.title)}</h1>
      ${ev.score ? `<div class="scoreboard"><b>${esc(ev.score)}</b>${ev.detail ? `<span>${esc(ev.detail)}</span>` : ""}</div>` : ""}
    </div>
    <div class="chat-area">
      <div class="msgs" id="msgs"></div>
      <div class="floats" id="floats"></div>
      <button class="new-pill" id="newPill">New messages ↓</button>
    </div>
    <div id="composer"></div>
  </div>`;

  document.getElementById("saveBtn")?.addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const on = await toggleFav(ev.id);
    btn.classList.toggle("on", on);
    btn.textContent = on ? "★ Saved" : "☆ Save";
  });

  const msgs = document.getElementById("msgs");
  const newPill = document.getElementById("newPill");
  let myName = null, lastName = null, lastAt = 0;
  const nearBottom = () => msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 90;
  const toBottom = () => { msgs.scrollTop = msgs.scrollHeight; newPill.classList.remove("show"); };
  msgs.addEventListener("scroll", () => { if (nearBottom()) newPill.classList.remove("show"); });
  newPill.onclick = toBottom;

  const avatarHtml = (m) => m.avatar
    ? `<div class="av" style="background-image:url('${esc(m.avatar)}')"></div>`
    : `<div class="av" style="background:${colorFor(m.name)}22;color:${colorFor(m.name)}">${esc(m.name[0]?.toUpperCase() || "?")}</div>`;
  const msgHtml = (m) => {
    // Mensajes seguidos de la misma persona se agrupan
    const grouped = m.name === lastName && m.at - lastAt < 120000;
    lastName = m.name; lastAt = m.at;
    const mine = myName && m.name === myName;
    const mention = myName && !mine && new RegExp(`@${myName}\\b`, "i").test(m.text);
    const text = esc(m.text).replace(/@([A-Za-z0-9_]{3,20})/g, '<span class="at">@$1</span>');
    return `<div class="msg ${grouped ? "grouped" : ""} ${mine ? "mine" : ""} ${mention ? "mention" : ""}" data-id="${esc(m.id)}" data-uid="${esc(m.uid || "")}" data-name="${esc(m.name)}">
      ${grouped ? `<div class="av-space"></div>` : avatarHtml(m)}
      <div class="bubble">${grouped ? "" : `<div class="who"><b style="color:${esc(m.color || colorFor(m.name))}">${esc(m.name)}</b>${m.role ? `<span class="staff">${m.role === "admin" ? "ADMIN" : "MOD"}</span>` : ""}<time>${timeOf(m.at)}</time></div>`}<div class="txt">${text}</div></div>
      ${isStaff() && !mine ? `<button class="mod-btn" aria-label="Moderate">⋯</button>` : ""}
    </div>`;
  };
  const add = (html, force) => {
    const atBottom = nearBottom();
    msgs.querySelector(".first")?.remove();
    msgs.insertAdjacentHTML("beforeend", html);
    while (msgs.children.length > 300) msgs.firstChild.remove();
    if (atBottom || force) toBottom(); else newPill.classList.add("show");
  };

  // Reacciones flotantes
  const floats = document.getElementById("floats");
  const floatEmoji = (emoji) => {
    if (!prefs.reactions || floats.childElementCount > 40) return;
    const el = document.createElement("span");
    el.className = "float";
    el.textContent = emoji;
    el.style.right = 12 + Math.random() * 60 + "px";
    el.style.setProperty("--drift", (Math.random() * 60 - 30) + "px");
    el.style.animationDuration = 2.2 + Math.random() * 1.2 + "s";
    floats.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  };

  const drawComposer = (canWrite, name, mutedUntil) => {
    const c = document.getElementById("composer");
    if (!c) return;
    myName = name;
    if (mutedUntil && new Date(mutedUntil) > Date.now()) {
      const until = new Date(mutedUntil);
      c.innerHTML = `<div class="muted-bar">🔇 You are muted until ${until.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" })}. You can still read the chat.</div>`;
      clearTimeout(c._t);
      c._t = setTimeout(() => drawComposer(canWrite, name), until - Date.now() + 1000);
      return;
    }
    if (!canWrite) {
      c.innerHTML = `<div class="join-card"><div><b>Join the conversation</b><span>Create a free account to chat and react.</span></div>
        <button class="btn" id="joinBtn">Sign up</button></div>`;
      document.getElementById("joinBtn").onclick = () => openLogin("signup");
      return;
    }
    c.innerHTML = `<div class="composer">
      <div class="react-bar">${REACTIONS.map((r) => `<button class="react" data-r="${r}" aria-label="React ${r}">${r}</button>`).join("")}</div>
      <div class="picker" id="picker">${PICKER.map((e) => `<button>${e}</button>`).join("")}</div>
      <form class="send" id="send">
        <div class="input-wrap">
          <button type="button" class="emoji-toggle" id="emojiBtn" aria-label="Emojis">😊</button>
          <input id="text" maxlength="300" placeholder="Send a message as ${esc(name)}…" autocomplete="off">
          <span class="count" id="count"></span>
        </div>
        <button class="send-btn" id="sendBtn" disabled aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z"/></svg></button>
      </form></div>`;
    const input = document.getElementById("text"), sendBtn = document.getElementById("sendBtn"), count = document.getElementById("count");
    const picker = document.getElementById("picker");
    const update = () => {
      sendBtn.disabled = !input.value.trim();
      const left = 300 - input.value.length;
      count.textContent = left <= 50 ? left : "";
      count.classList.toggle("low", left <= 20);
    };
    input.addEventListener("input", update);
    document.getElementById("send").onsubmit = (e) => {
      e.preventDefault();
      if (!input.value.trim()) return;
      socket.emit("message", input.value);
      input.value = ""; update(); picker.classList.remove("open");
    };
    document.getElementById("emojiBtn").onclick = () => picker.classList.toggle("open");
    picker.onclick = (e) => {
      if (e.target.tagName !== "BUTTON") return;
      input.value = (input.value + e.target.textContent).slice(0, 300); update(); input.focus();
    };
    c.querySelector(".react-bar").onclick = (e) => {
      const r = e.target.closest("[data-r]");
      if (!r) return;
      r.classList.remove("pop"); void r.offsetWidth; r.classList.add("pop");
      socket.emit("react", r.dataset.r);
    };
    update();
    if (matchMedia("(pointer:fine)").matches) input.focus();
  };

  socket = io();
  socket.on("connect", () => socket.emit("join", { roomId: id, name: guestName, token: session?.access_token }));
  socket.on("joined", ({ canWrite, name, mutedUntil }) => drawComposer(canWrite, name, mutedUntil));
  socket.on("muted", ({ until }) => drawComposer(true, myName, until));
  socket.on("deleted", (ids) => ids.forEach((mid) => msgs.querySelector(`.msg[data-id="${CSS.escape(mid)}"]`)?.remove()));
  const blockScreen = (icon, title, sub) => {
    socket.disconnect();
    const area = document.querySelector(".chat-area"), comp = document.getElementById("composer");
    if (area) area.innerHTML = `<div class="blocked"><div class="big">${icon}</div><b>${title}</b><span>${sub}</span><a class="btn" href="#/" style="margin-top:10px">Go to home</a></div>`;
    if (comp) comp.innerHTML = "";
  };
  socket.on("kicked", () => blockScreen("👢", "You were removed from this chat", "A moderator removed you. You can join again later."));
  socket.on("banned", ({ global, reason }) => blockScreen(global ? "⛔" : "🚫",
    global ? "You are banned from Rugo chats" : "You are banned from this chat",
    (reason ? `Reason: ${esc(reason)}. ` : "") + (global ? "You can't join any chat." : "You can still join other chats.")));
  // Menú de moderador al tocar ⋯ en un mensaje
  msgs.addEventListener("click", (e) => {
    const b = e.target.closest(".mod-btn");
    if (!b) return;
    const row = b.closest(".msg");
    openModSheet({ id: row.dataset.id, uid: row.dataset.uid, name: row.dataset.name, text: row.querySelector(".txt")?.textContent || "" });
  });
  socket.on("history", (list) => {
    lastName = null;
    msgs.innerHTML = list.map(msgHtml).join("") || `<div class="first"><div class="big">💬</div><b>No messages yet</b><span>Be the first to say something!</span></div>`;
    toBottom();
  });
  socket.on("message", (m) => add(msgHtml(m), myName && m.name === myName));
  socket.on("system", (t) => { if (t) { lastName = null; add(`<div class="sys">⚠️ ${esc(t)}</div>`, true); } });
  socket.on("notice", (t) => { lastName = null; add(`<div class="sys notice">${esc(t)}</div>`, true); });
  socket.on("react", floatEmoji);
  socket.on("avatar", ({ uid, avatar }) => {
    msgs.querySelectorAll(`.msg[data-uid="${CSS.escape(uid)}"] .av`).forEach((el) => {
      const name = el.closest(".msg").dataset.name;
      el.outerHTML = avatarHtml({ name, avatar });
    });
  });
  socket.on("online", (n) => { const o = document.getElementById("online"); if (o) o.innerHTML = `<span class="dot green"></span>${n}`; });
}

function askName(done) {
  app.innerHTML = `<div class="namebox"><h1>Pick a nickname</h1>
    <input class="field" id="nm" maxlength="20" placeholder="e.g. BuzzerBeater23">
    <button class="btn" id="go" style="width:100%">Join chat</button></div>`;
  const go = () => { const v = document.getElementById("nm").value.trim(); if (v) { localStorage.setItem("apodo", v); done(); } };
  document.getElementById("go").addEventListener("click", go);
  document.getElementById("nm").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  document.getElementById("nm").focus();
}

applyPrefs();
initAuth().finally(route);
</script>
